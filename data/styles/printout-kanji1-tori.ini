# peanatsu's shogi_printout 2-kanji set (xboard tiles): AR PL UKai glyphs (ShogiPrintoutKanji2.otf, Arphic Public License), Hari Seldon's cursive promoted pieces (ShogiCursive.otf, CC BY-SA 3.0) and its と (ShogiPrintoutKanji.otf, GPL-2). Each piece is one traced glyph.
[Style]
Name=1 kanji, AR PL UKai
Name[ja]=一字駒（AR PL UKai）
# The 2-kanji set is not offered for Tori shogi (its birds have one kanji each): this copy is, with the quails as one kanji.
Variant=Torishogi
Layout=1
Font=ShogiPrintoutKanji2.otf
GlyphY=58
GlyphScale=1.317
# As printed: the glyph keeps its size on a smaller koma.
KeepGlyphSize=true

[Text]
TO=
LQ=鶉
RQ=鶉

# The promoted pawn is one kanji among pairs; the pawn as large as on the printout, against its koma.
[Scale]
TO=0.49
FU=1.12
# Tori shogi's birds, one kanji each, traced as tall as a pair: within the koma.
SW=0.78
GO=0.78
FA=0.78
EA=0.78
CR=0.78
PH=0.78
PX=0.78

[Fonts]
TO=ShogiPrintoutKanji.otf
NY=ShogiCursive.otf
NK=ShogiCursive.otf
NG=ShogiCursive.otf
UM=ShogiCursive.otf
RY=ShogiCursive.otf
