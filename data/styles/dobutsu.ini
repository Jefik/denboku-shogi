[Style]
Name=Animals
Name[ja]=どうぶつ
Name[pt]=Animais
Shape=square
Font=NotoEmoji-shogi.ttf
FitEach=NotoEmoji-shogi.ttf
Layers=NotoEmoji-shogi-colors.otf
Pictures=true
MarkColor=#f06340

# Dōbutsu shōgi's lion, giraffe, elephant, chick and hen; Goro Goro Dōbutsu shōgi's dog (gold)
# and cat (silver); the rest chosen for how they move or their names: the knight a rabbit that
# jumps, the lance a boar that charges straight (猪突猛進), the dragon king a dragon, the dragon
# horse a horse, and the promoted silver, knight and lance grown up (tiger, kangaroo, rhinoceros).
[Text]
GY=🦁
OU=🦁
HI=🦒
KA=🐘
KI=🐕
GI=🐈
KE=🐇
KY=🐗
FU=🐥
RY=🐉
UM=🐎
NG=🐅
NK=🦘
NY=🦏
# Tori shogi's birds (tools/make-animal-colors.py says why each); the phoenix is U+E000 (tools/make-fonts.sh).
PX=
CR=🦩
PH=🐓
LQ=🐦
RQ=🐦
SW=🕊
GO=🪿
FA=🦜
EA=🦅
TO=🐔

# The quails tell their side by which way they face: the right one as the emoji does, the left one mirrored.
[Mirror]
LQ=true

# Color themes only: the colors under each outline, and ("top") over its thick black parts within a black rim (tools/make-animal-colors.py prints this group).
# The birds fill more of the tile than the animals: smaller, clear of the move marks.
[Scale]
CR=0.88
PH=0.78
GO=0.86
EA=0.8

[Layers]
