# peanatsu's shogi_printout 1-kanji set (its xboard tiles), traced into ShogiPrintoutKanji.otf: Un fonts glyphs, GPL-2 (data/fonts/LICENSE-ShogiPrintoutKanji.txt).
[Style]
Name=1 kanji, UnGungseo
Name[ja]=一字駒（UnGungseo）
Font=ShogiPrintoutKanji.otf
GlyphY=57
GlyphScale=1.025
# As printed: the glyph keeps its size on a smaller koma.
KeepGlyphSize=true
# Without the Tori shogi birds in its own font: the set is not offered there.
NotFor=Torishogi

# The printout's pawn text is 70% of the others': larger, so it reads at a glance.
[Scale]
FU=1.3
